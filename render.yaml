services:
  # ----------------------------------------------------------------------------
  # Backend Web Service (FastAPI + Uvicorn)
  # ----------------------------------------------------------------------------
  - type: web
    name: skyguard-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    # Required: this app has no `/` route (only `/api/health` and the routers
    # under `/api`). Render's default health check path is `/`, which 404s, so
    # the service is never promoted to serve traffic and requests hang
    # indefinitely instead of failing fast. This route is unauthenticated.
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: CORS_ORIGINS
        value: "*"
      - key: DATA_DIR
        value: ./data

  # ----------------------------------------------------------------------------
  # Frontend Static Site (React 18 + Vite)
  # ----------------------------------------------------------------------------
  # NOTE: static sites must NOT set `region` (global CDN) or `plan` (no compute
  # plan). Render rejects the whole Blueprint if either is present.
  - type: web
    name: skyguard-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Vite 8.3.0 requires node ^20.19.0 || >=22.12.0 or the build fails.
      - key: NODE_VERSION
        value: "22"
      # Render appended the "-0pgq" suffix because the name `skyguard-backend`
      # was already taken, so the service's real host is
      # skyguard-backend-0pgq.onrender.com. These values MUST match the URL
      # Render prints as "Available at your primary URL", or every fetch from
      # the static site targets a different (nonexistent) host.
      - key: VITE_API_URL
        value: https://skyguard-backend-0pgq.onrender.com
      - key: VITE_WS_URL
        value: wss://skyguard-backend-0pgq.onrender.com/api/live
