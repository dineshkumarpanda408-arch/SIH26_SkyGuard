version: '3.8'

services:
  skyguard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skyguard_app
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - CORS_ORIGINS=*
      - DATA_DIR=/app/data
      - STREAM_INTERVAL_SEC=2.0
    restart: unless-stopped
